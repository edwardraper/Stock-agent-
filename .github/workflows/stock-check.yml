name: Hoodie Stock Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print per-color/size availability to the log"
        type: boolean
        default: false
      test_message:
        description: "If set, sends this text as an ntfy notification instead of checking stock"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check stock
        env:
          NTFY_TOPIC: hoodie-restock-a1eb6a932d
          DEBUG: ${{ inputs.debug }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: python check_stock.py

      - name: Commit updated state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update stock state [skip ci]"
            git push
          fi
