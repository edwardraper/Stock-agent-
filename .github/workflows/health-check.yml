name: Daily Health Check

on:
  # PAUSED: the hoodie restock watch is done, so the daily 9am status
  # heartbeat is switched off too. Uncomment to resume.
  #
  # "0 8 * * *" is 09:00 UK time while the UK is on BST (UTC+1). GitHub
  # Actions cron is UTC-only and doesn't follow daylight saving, so use
  # "0 9 * * *" instead once the clocks go back to GMT.
  # schedule:
  #   - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send daily status
        env:
          NTFY_TOPIC: hoodie-restock-a1eb6a932d
          HEALTH_CHECK: "true"
        run: python check_stock.py
