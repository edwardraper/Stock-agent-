name: Health Check

on:
  schedule:
    # Mondays and Thursdays at 17:00 UK time. The UK is on BST (UTC+1)
    # right now, so that's 16:00 UTC. GitHub Actions cron is UTC-only and
    # doesn't follow daylight saving, so switch this to "0 17 * * 1,4"
    # once the clocks go back to GMT or it will fire at 4pm instead.
    - cron: "0 16 * * 1,4"
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send status
        env:
          NTFY_TOPIC: hoodie-restock-a1eb6a932d
          HEALTH_CHECK: "true"
        run: python check_stock.py
