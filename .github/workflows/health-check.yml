name: Daily Health Check

on:
  schedule:
    # 09:00 UK time while the UK is on BST (UTC+1). GitHub Actions cron is
    # UTC-only and doesn't follow daylight saving, so switch this to
    # "0 9 * * *" once the clocks go back to GMT.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send daily status
        env:
          NTFY_TOPIC: hoodie-restock-a1eb6a932d
          HEALTH_CHECK: "true"
        run: python check_stock.py
