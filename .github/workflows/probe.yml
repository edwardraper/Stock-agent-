name: Probe Product Page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Product page URL to inspect"
        type: string
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Probe
        env:
          PROBE_URL: ${{ inputs.url }}
        run: python probe.py
